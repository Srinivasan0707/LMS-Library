<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Command Center | LMS Prime</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Admin Specific Styles */
    .dashboard-grid {
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 30px;
        padding: 40px 5%;
        align-items: start;
    }

    .admin-card {
        background: rgba(20, 20, 30, 0.6);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 20px;
        padding: 30px;
    }

    h2 { border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-top: 0; }

    /* Table Styling */
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        color: #ddd;
    }

    th, td {
        padding: 15px;
        text-align: left;
        border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    th { color: var(--accent); font-weight: 600; text-transform: uppercase; font-size: 0.85rem; }
    tr:hover { background: rgba(255,255,255,0.02); }

    /* Form Inputs */
    input.admin-input {
        width: 100%;
        background: rgba(0,0,0,0.3);
        border: 1px solid #444;
        padding: 12px;
        border-radius: 8px;
        color: white;
        margin-bottom: 15px;
        box-sizing: border-box;
    }

    input.admin-input:focus { border-color: var(--accent); outline: none; }

    /* Action Buttons */
    .btn-action { width: auto; padding: 8px 15px; font-size: 0.85rem; margin: 0; }
    .btn-issue { background: linear-gradient(45deg, #00d4ff, #005bea); }
    .btn-return { background: linear-gradient(45deg, #ff9900, #ff4b5c); }
    .btn-logout { background: #ff4b5c; width: auto; padding: 8px 20px; float: right; font-size: 0.9rem; }
  </style>
</head>
<body>

<nav>
  <div class="logo">LMS <span style="color:var(--accent)">ADMIN</span></div>
  <button onclick="logout()" class="btn-logout">Logout</button>
</nav>

<div class="dashboard-grid">

  <div class="admin-card">
    <h2>📚 Manage Books</h2>
    <input type="text" id="title" class="admin-input" placeholder="Book Title">
    <input type="text" id="author" class="admin-input" placeholder="Author Name">
    <input type="text" id="cat" class="admin-input" placeholder="Category (e.g. Sci-Fi)">
    <input type="number" id="price" class="admin-input" placeholder="Price (₹)">

    <button onclick="addBook()">Add to Library</button>

    <h2 style="margin-top: 40px;">⚡ Quick Actions</h2>
    <div style="background:rgba(255,255,255,0.05); padding:15px; border-radius:10px; margin-bottom:15px;">
      <h4 style="margin:0 0 10px; color:var(--accent);">Issue Book</h4>
      <input type="number" id="issueBookId" class="admin-input" placeholder="Book ID">
      <input type="number" id="issueUserId" class="admin-input" placeholder="User ID">
      <button onclick="issueBook()" class="btn-issue">Issue Now</button>
    </div>

    <div style="background:rgba(255,255,255,0.05); padding:15px; border-radius:10px;">
      <h4 style="margin:0 0 10px; color:#ff9900;">Return Book</h4>
      <input type="number" id="returnTransId" class="admin-input" placeholder="Transaction ID">
      <button onclick="returnBook()" class="btn-return">Process Return</button>
    </div>
  </div>

  <div class="admin-card">
    <h2>📊 Live Transaction History</h2>
    <div style="overflow-x:auto;">
      <table>
        <thead>
        <tr>
          <th>Trans ID</th>
          <th>Book Title</th>
          <th>User</th>
          <th>Issue Date</th>
          <th>Return Date</th>
          <th>Status</th>
        </tr>
        </thead>
        <tbody id="transList">
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const API = "http://localhost:8080/api";

  // Security Check
  const user = JSON.parse(localStorage.getItem("user"));
  if(!user || user.role !== "ADMIN") {
      window.location.href = "login.html";
  }

  function logout() { localStorage.clear(); window.location.href="login.html"; }

  // 1. Load Transactions
  async function loadData() {
      const res = await fetch(API + "/transactions");
      const data = await res.json();

      const list = document.getElementById("transList");
      list.innerHTML = data.map(t => {
          const isReturned = t.returnDate !== null;
          const statusColor = isReturned ? "#00ff88" : "#ff4b5c";
          const statusText = isReturned ? `Returned (Fine: ₹${t.fine})` : "Pending";

          return `
          <tr>
              <td style="color:#888">#${t.id}</td>
              <td style="font-weight:600; color:white;">${t.book.title}</td>
              <td>${t.user.name}</td>
              <td>${t.issueDate}</td>
              <td>${t.returnDate || '-'}</td>
              <td style="color:${statusColor}">${statusText}</td>
          </tr>`;
      }).join("");
  }

  // 2. Add Book (Updated with Price)
  async function addBook() {
      const title = document.getElementById("title").value;
      const author = document.getElementById("author").value;
      const cat = document.getElementById("cat").value;
      const price = document.getElementById("price").value; // Get Price

      if(!title || !author || !price) return alert("Please fill all details");

      await fetch(API + "/books", {
          method:"POST", headers:{"Content-Type":"application/json"},
          // Send Price to Backend
          body:JSON.stringify({title, author, category:cat, price: price})
      });
      alert("✅ Book Added with Price!");

      // Clear all inputs
      document.getElementById("title").value = "";
      document.getElementById("author").value = "";
      document.getElementById("cat").value = "";
      document.getElementById("price").value = "";
  }

  // 3. Issue Book
  async function issueBook() {
      const bid = document.getElementById("issueBookId").value;
      const uid = document.getElementById("issueUserId").value;
      const res = await fetch(`${API}/issue?bookId=${bid}&userId=${uid}`, {method:"POST"});
      const txt = await res.text();
      alert(txt.includes("Success") ? "✅ " + txt : "❌ " + txt);
      loadData();
  }

  // 4. Return Book
  async function returnBook() {
      const tid = document.getElementById("returnTransId").value;
      const res = await fetch(`${API}/return?transId=${tid}`, {method:"POST"});
      const txt = await res.text();
      alert("✅ " + txt);
      loadData();
  }

  loadData();
</script>
</body>
</html>
